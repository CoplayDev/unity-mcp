name: Docs — Sync Release Notes

# Keeps website/docs/releases.md and the README's "Recent Updates" block
# in sync with the GitHub Releases API. Source of truth is GitHub Releases.
#
# Triggers (intentionally narrow):
#   - workflow_dispatch: release.yml dispatches this right after it creates
#     a release. That release is made with GITHUB_TOKEN, and events made
#     with GITHUB_TOKEN start no workflows (workflow_dispatch and
#     repository_dispatch are the exceptions), so the release trigger below
#     never fires for it. Also the manual escape hatch (re-run after a
#     one-off GitHub UI edit to a release body, or to backfill).
#   - release.published / edited / unpublished / deleted: releases that a
#     person creates or edits in the GitHub UI.
#
# Why no pull_request / schedule triggers:
#   - PR-time drift-check would fail outsider PRs that touched README for
#     unrelated reasons (e.g. typo fixes) and the contributor has no push
#     access to fix it. The synced files are maintained by the release
#     pipeline, not by PR authors — drift can't logically be introduced
#     by a PR that the workflow couldn't already handle on release.
#   - A daily cron would mask the source-of-truth (release events) and
#     produce mystery commits unattached to a release. Better to let
#     workflow_dispatch handle the rare out-of-band UI edit.
#
# Behavior:
#   - The `beta` ruleset requires a pull request, so the job pushes a
#     branch, opens a PR into beta and merges it, like beta-release.yml.
#     The change is mechanical (re-render from API output) and confined
#     to two well-known files.
#   - That merge is made with GITHUB_TOKEN too, so it does not start
#     "Docs — Build & Deploy"; the site shows the new releases.md after
#     the next push to beta that deploys it.

on:
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docs-sync-releases
  cancel-in-progress: false

jobs:
  sync:
    name: Sync release notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          # Full history so the commit lands on a fresh ref tip.
          fetch-depth: 0
          # The PR step pushes a branch, so the token must persist here.
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/sync_release_notes.py

      - name: Open and merge a PR into beta (if anything changed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- website/docs/releases.md README.md; then
            echo "No drift — release notes already up to date."
            exit 0
          fi
          BRANCH="docs/release-notes-${GITHUB_RUN_ID}"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH"
          git add website/docs/releases.md README.md
          git commit -m "docs: sync release notes from GitHub Releases"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --base beta \
            --head "$BRANCH" \
            --title "docs: sync release notes from GitHub Releases" \
            --body "Automated re-render of website/docs/releases.md and the README's Recent Updates block from the GitHub Releases API.")
          gh pr merge "$PR_URL" --merge --delete-branch
